        startedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        startedBy: { type: integer }
        sourceMaxSyncedAt: { type: ["string", "null"], format: date-time }
        totalSourceRowsExamined: { type: integer }
        newLearnersDetected: { type: integer }
        learnerUpdatesDetected: { type: integer }
        cohortsProposed: { type: integer }
        allocationsProposed: { type: integer }
        transfersProposed: { type: integer }
        approvedCount: { type: integer }
        appliedCount: { type: integer }
        skippedCount: { type: integer }
        conflictCount: { type: integer }
        errorCount: { type: integer }
        approvalReason: { type: ["string", "null"] }
        correlationId: { type: ["string", "null"] }
        errorSummary: { type: ["string", "null"] }
