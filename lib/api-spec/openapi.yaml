    FsRequirementImportJobStatus:
      type: string
      enum: [ready, importing, completed, cancelled]

    FsRequirementRowOutcome:
      type: string
      description: >-
        new: no requirement row exists yet. changed: a row exists and the
        proposed value differs. unchanged: a row exists, status='recorded',
        identical to proposed -- a no-op at commit. warning: a later row
        repeating an earlier row's SAME learnerID and AIM in this file --
        collapsed, only the first occurrence is applied. error: blocks the
        whole commit until fixed and re-uploaded (unknown/ambiguous
        learnerID, blank/unrecognised AIM, or conflicting AIM values for
        the same learnerID within the file).
      enum: [new, changed, unchanged, warning, error]

    FsRequirementImportJob:
      type: object
      required:
        [
          id, filename, uploadedBy, status, totalRows, newCount, changedCount, unchangedCount,
          warningCount, errorCount, resultSummary, lastError, startedImportingAt, createdAt, updatedAt, expiresAt,
        ]
      properties:
        id: { type: integer }
        filename: { type: string }
        uploadedBy: { type: integer }
        status: { $ref: "#/components/schemas/FsRequirementImportJobStatus" }
        totalRows: { type: integer }
        newCount: { type: integer }
        changedCount: { type: integer }
        unchangedCount: { type: integer }
        warningCount: { type: integer }
        errorCount: { type: integer }
        resultSummary:
          oneOf: [{ type: object, additionalProperties: true }, { type: "null" }]
        lastError: { oneOf: [{ type: string }, { type: "null" }] }
        startedImportingAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

