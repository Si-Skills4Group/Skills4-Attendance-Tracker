    TutorMappingCorrectionPreviewRequest:
      type: object
      required: [sourceTutorId, targetTutorId, budTutorId]
      properties:
        sourceTutorId: { type: integer }
        targetTutorId: { type: integer }
        budTutorId: { type: string }

    TutorMappingFieldChange:
      type: object
      required: [tutorId, field, before, after]
      properties:
        tutorId: { type: integer }
        field: { type: string }
        before: { type: ["string", "null"] }
        after: { type: ["string", "null"] }

    TutorMappingCorrectionPreview:
      type: object
      required:
        [
          sourceTutor, targetTutor, budTutorId, nameMatch, supportingSignals,
          requiresManualIdentityConfirmation, conflictingIdentifierOwnership,
          fieldChanges, downstreamEffects, remainingUnresolved, preview,
        ]
      properties:
        sourceTutor: { $ref: "#/components/schemas/TutorIdentitySummary" }
        targetTutor: { $ref: "#/components/schemas/TutorIdentitySummary" }
        budTutorId: { type: string }
        nameMatch:
          type: boolean
          description: A supporting signal only -- two different people can share a name. Never treated as proof.
        supportingSignals:
          type: array
          description: Signals for a human to weigh (e.g. shared phone, a prior direct transfer between these two records) -- none of them, singly or combined, constitute identity confirmation.
          items: { type: string }
        requiresManualIdentityConfirmation:
          type: boolean
          description: Always true -- every correction requires an explicit identityConfirmedByAdmin=true at commit, regardless of supportingSignals.
        conflictingIdentifierOwnership:
          type: array
          items: { type: string }
        fieldChanges:
          type: array
          items: { $ref: "#/components/schemas/TutorMappingFieldChange" }
        downstreamEffects:
          type: array
          items: { type: string }
        remainingUnresolved:
          type: array
          items: { type: string }
        preview:
          type: object
          required: [sourceTutorUpdatedAt, targetTutorUpdatedAt]
          properties:
            sourceTutorUpdatedAt: { type: string, format: date-time }
            targetTutorUpdatedAt: { type: string, format: date-time }

    TutorMappingCorrectionCommitRequest:
      type: object
      required: [sourceTutorId, targetTutorId, budTutorId, expectedSourceTutorUpdatedAt, expectedTargetTutorUpdatedAt, reason]
      properties:
        sourceTutorId: { type: integer }
        targetTutorId: { type: integer }
        budTutorId: { type: string }
        expectedSourceTutorUpdatedAt: { type: string, format: date-time }
        expectedTargetTutorUpdatedAt: { type: string, format: date-time }
        reason: { type: string }
        identityConfirmedByAdmin:
          type: boolean
          default: false
          description: Required (true) when the preview's identityConfirmed was false -- an explicit admin acknowledgement that a human, not the system, verified these are the same person.

    TutorMappingCorrectionResult:
      type: object
      required: [sourceTutorId, targetTutorId, budTutorId, appliedAt, reason, invalidatedPreviewJobIds]
      properties:
        sourceTutorId: { type: integer }
        targetTutorId: { type: integer }
        budTutorId: { type: string }
        appliedAt: { type: ["string", "null"], format: date-time }
        reason: { type: string }
        invalidatedPreviewJobIds:
          type: array
          description: Any 'ready' (unapplied) Bud sync preview jobs marked 'failed' by this correction, since their proposed values may reference the old tutor mapping. Generate a new preview to see the corrected matching.
          items: { type: integer }

