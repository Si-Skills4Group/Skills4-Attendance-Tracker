        matchStatus: { $ref: "#/components/schemas/BudSyncMatchStatus" }
        actionType: { $ref: "#/components/schemas/BudSyncActionType" }
        internalLearnerId: { type: ["integer", "null"] }
        proposedValues:
          type: object
          additionalProperties: true
        previousValues:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items: { type: string }
        reason: { type: ["string", "null"] }
        approved: { type: boolean }
        applied: { type: boolean }
        outcome: { type: ["string", "null"] }
        errorCode: { type: ["string", "null"] }
        processedAt: { type: ["string", "null"], format: date-time }
        sourceLearnerReference: { type: ["string", "null"] }
        sourceFirstName: { type: ["string", "null"] }
        sourceLastName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    BudSyncItemListResponse:
