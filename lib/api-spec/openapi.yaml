        items:
          type: array
          items: { $ref: "#/components/schemas/LastAttendanceRow" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    EngagementSource:
      type: string
      enum: [attendance, bud_submission, bud_completed_activity, catchup]

    EngagementBudStatus:
      type: string
      description: >-
        not_authorized: the caller does not have an established permission
        to view this learner's Bud activity (no Bud dates or plan id are
        returned at all). not_linked: no admin-confirmed Bud learning-plan
        link exists for this learner. missing_source: a link exists but
        the plan is not present in the current Bud extract (needs
        review). needs_review: the linked plan does not appear to be the
        learner's relevant CURRENT plan (see budPlanCurrency) -- its dates
        are withheld, not shown as current. resolved: the linked plan was
        found, is the relevant current plan (or the learner has no
        current plan at all to conflict with it), and its dates (if any)
        are shown for reference -- but never included in
        latestEngagementDate; see EngagementRecencyItem's description.
      enum: [not_authorized, not_linked, missing_source, needs_review, resolved]

    EngagementBudPlanCurrency:
      type: string
      description: >-
        Null when budStatus is not_authorized/not_linked/missing_source
        (the question doesn't apply). current: the linked plan is the
        learner's only/most-recently-confirmed 'In Progress' plan.
        no_current_plan: the linked plan isn't 'In Progress', and no
        OTHER plan sharing its learner_reference is either -- not
        ambiguous, just inactive. linked_plan_not_current: a DIFFERENT
        plan sharing the same learner_reference is 'In Progress' while
        the linked one is not -- the link may be stale.
        multiple_current_plans_ambiguous: 2+ plans sharing the same
        learner_reference are concurrently 'In Progress' -- which is
        relevant cannot be determined automatically.
      enum: [current, no_current_plan, linked_plan_not_current, multiple_current_plans_ambiguous]

    EngagementRecencyItem:
      type: object
      required:
        [
          id, learnerRef, learnerName, programme,
          lastLiveAttendance, lastBudSubmission, lastBudCompletedActivity, lastCatchupCompletion,
          latestEngagementDate, sources, daysSinceEngagement,
          budStatus, hasIncompleteSourceCoverage, dataQualityIssues, sourceLimitations,
        ]
      properties:
        id: { type: integer }
        learnerRef: { type: string }
        learnerName: { type: string }
        tutorName: { oneOf: [{ type: string }, { type: "null" }] }
        programme: { type: string }
        lastLiveAttendance:
          description: Most recent session date with status present/late, drawn only from sessions the caller has session-level authority over -- future, cancelled and deleted sessions excluded. Contributes to latestEngagementDate.
          oneOf: [{ type: string, format: date }, { type: "null" }]
        lastBudSubmission:
          description: >-
            Reference only -- learner_progress.last_submission_date's
            upstream meaning (learner-initiated vs assessor/system update)
            has not been confirmed. NEVER included in
            latestEngagementDate/sources/daysSinceEngagement. Null
            whenever budStatus is not "resolved" (unauthorised, unlinked,
            missing, or the linked plan isn't the relevant current one).
          oneOf: [{ type: string, format: date }, { type: "null" }]
        lastBudCompletedActivity:
          description: Same caveats as lastBudSubmission -- learner_progress.last_completed_activity's real-world meaning is unverified.
          oneOf: [{ type: string, format: date }, { type: "null" }]
        lastCatchupCompletion:
          description: The catch-up's own completion date, drawn only from sessions the caller has session-level authority over -- never the original missed session date, never when the tutor entered the confirmation. Contributes to latestEngagementDate.
          oneOf: [{ type: string, format: date }, { type: "null" }]
        latestEngagementDate:
          description: The most recent valid qualifying date across ONLY the verified sources (live attendance, effective catch-up) -- Bud dates never contribute. Null means "No recorded engagement", not zero days.
          oneOf: [{ type: string, format: date }, { type: "null" }]
        sources:
          type: array
          items: { $ref: "#/components/schemas/EngagementSource" }
          description: Currently only ever contains attendance/catchup -- see latestEngagementDate.
        sourcesText: { type: string, description: "Same as sources, semicolon-joined (used by the CSV export)." }
        daysSinceEngagement: { oneOf: [{ type: integer }, { type: "null" }] }
        budStatus: { $ref: "#/components/schemas/EngagementBudStatus" }
        budPlanCurrency:
          oneOf: [{ $ref: "#/components/schemas/EngagementBudPlanCurrency" }, { type: "null" }]
        hasIncompleteSourceCoverage:
          type: boolean
          description: True whenever Bud could not be reliably and authorisedly resolved to a current plan for this caller (budStatus != "resolved").
        dataQualityIssues:
          type: array
          items: { type: string }
          description: Human-readable notes for any attendance/catch-up candidate date excluded for being in the future.
        dataQualityIssuesText: { type: string }
        sourceLimitations:
          type: array
          items: { type: string }
          description: Human-readable caveats about Bud source coverage/permission/currency for this row and this caller (item 5's "Source/matching limitations" column) -- always includes an "unverified" note whenever a Bud date is shown.
        sourceLimitationsText: { type: string }
        budLinkedPlanId:
          description: Null when budStatus is "not_authorized" -- the plan id itself is withheld, not just its dates.
          oneOf: [{ type: string }, { type: "null" }]
        budResolvedPlanId: { oneOf: [{ type: string }, { type: "null" }] }
        budSyncedAt:
          description: Source-refresh freshness only -- never engagement evidence. Null unless budStatus is "resolved" or "needs_review".
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        budStatusDesc: { oneOf: [{ type: string }, { type: "null" }] }

    EngagementRecencyList:
      type: object
      required: [items, total, page, pageSize, calculatedAt, scopeLabel]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EngagementRecencyItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        calculatedAt: { type: string, format: date-time }
        scopeLabel:
          type: string
          description: States the population this result is based on for the caller's authorised scope.

    EngagementRecencySummary:
      type: object
      required: [totalLearners, noRecordedEngagementCount, calculatedAt, scopeLabel]
      properties:
        totalLearners: { type: integer }
        noRecordedEngagementCount: { type: integer }
        calculatedAt: { type: string, format: date-time }
        scopeLabel: { type: string }

    EngagementEvidenceAttendance:
      type: object
      required: [sessionId, sessionDate, status]
      properties:
        sessionId: { type: integer }
        sessionDate: { type: string, format: date }
        sessionTitle: { oneOf: [{ type: string }, { type: "null" }] }
        status: { $ref: "#/components/schemas/AttendanceStatus" }

    EngagementEvidenceCatchup:
      type: object
      required: [catchupId, sessionId, sessionDate, completionDate, method, confirmedAt, confirmedByUserId]
      properties:
        catchupId: { type: integer }
        sessionId: { type: integer }
        sessionDate: { type: string, format: date }
        completionDate: { type: string, format: date }
        method: { $ref: "#/components/schemas/CatchupMethod" }
        note: { oneOf: [{ type: string }, { type: "null" }] }
        confirmedAt: { type: string, format: date-time }
        confirmedByUserId: { type: integer }

    EngagementEvidenceBud:
      type: object
      properties:
        linkedPlanId: { oneOf: [{ type: string }, { type: "null" }] }
        resolvedPlanId: { oneOf: [{ type: string }, { type: "null" }] }
        lastSubmissionDate: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        lastCompletedActivity: { oneOf: [{ type: string, format: date }, { type: "null" }] }
        syncedAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        statusDesc: { oneOf: [{ type: string }, { type: "null" }] }
        learningPlanUrl: { oneOf: [{ type: string }, { type: "null" }] }

    EngagementRecencyDetail:
      type: object
      required: [latestEngagementDate, sources, daysSinceEngagement, dataQualityIssues, budStatus, hasIncompleteSourceCoverage, sourceLimitations, calculatedAt, scopeLabel]
      properties:
        latestEngagementDate: { oneOf: [{ type: string, format: date }, { type: "null" }] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/EngagementSource" }
        daysSinceEngagement: { oneOf: [{ type: integer }, { type: "null" }] }
        dataQualityIssues:
          type: array
          items: { type: string }
        budStatus: { $ref: "#/components/schemas/EngagementBudStatus" }
        budPlanCurrency:
          oneOf: [{ $ref: "#/components/schemas/EngagementBudPlanCurrency" }, { type: "null" }]
        hasIncompleteSourceCoverage: { type: boolean }
        sourceLimitations:
          type: array
          items: { type: string }
        lastBudSubmission: { oneOf: [{ type: string, format: date }, { type: "null" }] }
        lastBudCompletedActivity: { oneOf: [{ type: string, format: date }, { type: "null" }] }
        budLinkedPlanId: { oneOf: [{ type: string }, { type: "null" }] }
        budResolvedPlanId: { oneOf: [{ type: string }, { type: "null" }] }
        budSyncedAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        budStatusDesc: { oneOf: [{ type: string }, { type: "null" }] }
        attendanceEvidence:
          oneOf: [{ $ref: "#/components/schemas/EngagementEvidenceAttendance" }, { type: "null" }]
        catchupEvidence:
          oneOf: [{ $ref: "#/components/schemas/EngagementEvidenceCatchup" }, { type: "null" }]
        budEvidence:
          description: Only populated when budStatus is "resolved" (authorised, linked, current) -- withheld entirely otherwise, not just its dates.
          oneOf: [{ $ref: "#/components/schemas/EngagementEvidenceBud" }, { type: "null" }]
        calculatedAt: { type: string, format: date-time }
        scopeLabel:
          type: string
          description: >-
            States whether this result is the caller's full authorised
            evidence (admin) or restricted to what they can individually
            see (a tutor) -- e.g. "Based on engagement visible to you".

    AttendanceHoursItem:
      type: object
      required: [key, label, metrics]
      properties:
        key: { type: string }
