            - $ref: "#/components/schemas/SessionSummary"
            - type: "null"
        attendancePercentage:
          oneOf:
            - type: number
            - type: "null"
        registerCompletion: { $ref: "#/components/schemas/RegisterCompletionSummary" }
        lowAttendanceLearnerCount: { type: integer }

    AdminTutorOverviewRow:
      type: object
      required:
        [
          tutorId,
          tutorName,
          activeCohorts,
          activeLearners,
          attendancePercentage,
          registerCompletion,
          lowAttendanceLearnerCount,
        ]
      properties:
        tutorId: { type: integer }
        tutorName: { type: string }
        activeCohorts: { type: integer }
        activeLearners: { type: integer }
        attendancePercentage:
          oneOf:
            - type: number
            - type: "null"
        registerCompletion: { $ref: "#/components/schemas/RegisterCompletionSummary" }
        lowAttendanceLearnerCount: { type: integer }

    AdminTutorOverviewListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminTutorOverviewRow" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AdminCohortOverviewRow:
      type: object
      required:
        [
