openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Skills4Attendance API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: dashboard
  - name: tutors
  - name: learners
  - name: cohorts
  - name: allocation
  - name: secondary-enrollments
  - name: attendance
  - name: attendance-summary
  - name: reports
  - name: audit
  - name: settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------- Auth ----------
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Dashboard ----------
  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Admin dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /dashboard/tutor:
    get:
      operationId: getTutorDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Tutor dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorDashboard"
  /dashboard/tutor/cohorts:
    get:
      operationId: getTutorDashboardCohorts
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
      responses:
        "200":
          description: Cohort cards for the current tutor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TutorCohortOverviewRow" }
  /dashboard/tutor/outstanding-registers:
    get:
      operationId: getTutorOutstandingRegisters
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Registers awaiting completion for the current tutor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutstandingRegisterListResponse"
  /dashboard/tutor/low-attendance-learners:
    get:
      operationId: getTutorLowAttendanceLearners
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Learners below the low-attendance threshold, scoped to the current tutor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerAttendanceSummaryListResponse"
  /dashboard/admin/tutors:
    get:
      operationId: getAdminDashboardTutors
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Per-tutor attendance/completion overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTutorOverviewListResponse"
  /dashboard/admin/cohorts:
    get:
      operationId: getAdminDashboardCohorts
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Per-cohort attendance/completion overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCohortOverviewListResponse"
  /dashboard/admin/outstanding-registers:
    get:
      operationId: getAdminOutstandingRegisters
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Registers awaiting completion, organisation-wide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutstandingRegisterListResponse"
  /dashboard/admin/low-attendance-learners:
    get:
      operationId: getAdminLowAttendanceLearners
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Learners below the low-attendance threshold, organisation-wide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerAttendanceSummaryListResponse"

  # ---------- Attendance summary (reusable calculation endpoints) ----------
  /attendance-summary/learners/{learnerId}:
    get:
      operationId: getLearnerAttendanceSummary
      tags: [attendance-summary]
      parameters:
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
      responses:
        "200":
          description: Attendance summary for one learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerAttendanceSummaryDetailResponse"
        "400":
          description: Invalid period/date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Learner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance-summary/cohorts/{cohortId}:
    get:
      operationId: getCohortAttendanceSummary
      tags: [attendance-summary]
      parameters:
        - name: cohortId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
      responses:
        "200":
          description: Attendance summary for one cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummaryResponse"
        "400":
          description: Invalid period/date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cohort not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance-summary/tutors/{tutorId}:
    get:
      operationId: getTutorAttendanceSummary
      tags: [attendance-summary]
      parameters:
        - name: tutorId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
      responses:
        "200":
          description: Attendance summary for one tutor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummaryResponse"
        "400":
          description: Invalid period/date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tutor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Tutors ----------
  /tutors:
    get:
      operationId: listTutors
      tags: [tutors]
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: List of tutors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tutor" }
    post:
      operationId: createTutor
      tags: [tutors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorInput"
      responses:
        "201":
          description: Tutor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tutor"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # ---------- Controlled tutor CSV import (job-based) ----------
  /tutors/import-jobs/template:
    get:
      operationId: getTutorImportTemplate
      tags: [tutors]
      responses:
        "200":
          description: CSV template content for the controlled tutor import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvContent"
  /tutors/import-jobs:
    post:
      operationId: uploadTutorImport
      tags: [tutors]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Upload parsed and classified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorImportJob"
        "400":
          description: File rejected (too large, malformed, wrong columns, too many rows)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tutors/import-jobs/{jobId}:
    get:
      operationId: getTutorImportJob
      tags: [tutors]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Import job status and counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorImportJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tutors/import-jobs/{jobId}/rows:
    get:
      operationId: listTutorImportJobRows
      tags: [tutors]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
        - name: classification
          in: query
          schema: { $ref: "#/components/schemas/TutorImportRowClassification" }
      responses:
        "200":
          description: Paginated import job rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorImportJobRowListResponse"
  /tutors/import-jobs/{jobId}/rows/{rowId}:
    patch:
      operationId: resolveTutorImportJobRow
      tags: [tutors]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
        - name: rowId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorImportRowResolveInput"
      responses:
        "200":
          description: Row resolution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorImportJobRow"
        "400":
          description: Row cannot be resolved (new/blocked row, or invalid resolution value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tutors/import-jobs/{jobId}/rows/errors.csv:
    get:
      operationId: downloadTutorImportErrors
      tags: [tutors]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: CSV report of every row with errors, formula-injection sanitized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvContent"
  /tutors/import-jobs/{jobId}/confirm:
    post:
      operationId: confirmTutorImportJob
      tags: [tutors]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Import applied (or, if already completed, the same stored result -- confirming is idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorImportResult"
        "409":
          description: Job is not in a confirmable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tutors/import-jobs/{jobId}/cancel:
    post:
      operationId: cancelTutorImportJob
      tags: [tutors]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Import job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorImportJob"
        "409":
          description: Job cannot be cancelled (already completed or importing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tutors/{id}:
    get:
      operationId: getTutor
      tags: [tutors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tutor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tutor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTutor
      tags: [tutors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorUpdate"
      responses:
        "200":
          description: Tutor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tutor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tutors/{id}/activate:
    post:
      operationId: activateTutor
      tags: [tutors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tutor activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tutor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tutors/{id}/deactivate:
    post:
      operationId: deactivateTutor
      tags: [tutors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: confirm
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Tutor deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tutor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tutor has active cohorts assigned; retry with confirm=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Learners ----------
  /learners:
    get:
      operationId: listLearners
      tags: [learners]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/LearnerStatus" }
        - name: programme
          in: query
          schema: { type: string }
        - name: level
          in: query
          schema: { type: string }
        - name: employer
          in: query
          schema: { type: string }
        - name: tutorId
          in: query
          schema: { type: integer }
        - name: cohortId
          in: query
          schema: { type: integer }
        - name: unallocated
          in: query
          description: When true, returns only learners with no tutor assigned. Takes precedence over tutorId.
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Paginated learner list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerListResponse"
    post:
      operationId: createLearner
      tags: [learners]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnerInput"
      responses:
        "201":
          description: Learner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learner"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # ---------- Controlled learner CSV import (job-based) ----------
  /learners/import-jobs/template:
    get:
      operationId: getLearnerImportTemplate
      tags: [learners]
      responses:
        "200":
          description: CSV template content for the controlled learner import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvContent"
  /learners/import-jobs:
    post:
      operationId: uploadLearnerImport
      tags: [learners]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Upload parsed and classified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerImportJob"
        "400":
          description: File rejected (too large, malformed, wrong columns, too many rows)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /learners/import-jobs/{jobId}:
    get:
      operationId: getLearnerImportJob
      tags: [learners]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Import job status and counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerImportJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /learners/import-jobs/{jobId}/rows:
    get:
      operationId: listLearnerImportJobRows
      tags: [learners]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
        - name: classification
          in: query
          schema: { $ref: "#/components/schemas/LearnerImportRowClassification" }
      responses:
        "200":
          description: Paginated import job rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerImportJobRowListResponse"
  /learners/import-jobs/{jobId}/rows/{rowId}:
    patch:
      operationId: resolveLearnerImportJobRow
      tags: [learners]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
        - name: rowId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnerImportRowResolveInput"
      responses:
        "200":
          description: Row resolution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerImportJobRow"
        "400":
          description: Row cannot be resolved (new/blocked row, or invalid resolution value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /learners/import-jobs/{jobId}/rows/errors.csv:
    get:
      operationId: downloadLearnerImportErrors
      tags: [learners]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: CSV report of every row with errors, formula-injection sanitized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvContent"
  /learners/import-jobs/{jobId}/confirm:
    post:
      operationId: confirmLearnerImportJob
      tags: [learners]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Import applied (or, if already completed, the same stored result -- confirming is idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerImportResult"
        "409":
          description: Job is not in a confirmable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /learners/import-jobs/{jobId}/cancel:
    post:
      operationId: cancelLearnerImportJob
      tags: [learners]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Import job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerImportJob"
        "409":
          description: Job cannot be cancelled (already completed or importing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Stage 5: admin-uploaded Functional Skills requirement ----------
  # An interim, manually-sourced substitute for ILR aim data -- never a
  # BUD/ILR integration. Admin-only upload/preview/commit/cancel/clear;
  # the learner-detail read reuses require_learner_access (not admin-only).
  /functional-skills-requirements/import-jobs/template:
    get:
      operationId: getFsRequirementImportTemplate
      tags: [functional-skills-requirements]
      responses:
        "200":
          description: CSV template content (learnerID,AIM)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsvContent" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /functional-skills-requirements/import-jobs:
    post:
      operationId: uploadFsRequirementImport
      tags: [functional-skills-requirements]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Upload parsed and classified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FsRequirementImportJob" }
        "400":
          description: File rejected (too large, malformed, wrong columns, too many rows)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Administrator access required
          content:
