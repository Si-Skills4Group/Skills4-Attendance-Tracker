        for this cohort -- nothing is created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSessionsInput" }
      responses:
        "200":
          description: The resolved date list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateSessionsPreview" }
        "400":
          description: The pattern can't be resolved (first date not on the chosen weekday, inverted range, or too many sessions)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /attendance/sessions/generate/confirm:
    post:
      operationId: confirmGenerateSessions
      tags: [attendance]
      description: >-
        Re-resolves the same pattern and re-checks every date fresh, then
        creates a session (with its expected-learners snapshot) for every
        date that doesn't already have one, in a single transaction. A date
        that gained a session since the preview is skipped, never
        double-booked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateSessionsInput" }
      responses:
        "201":
          description: Sessions created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateSessionsResult" }
        "400":
          description: The pattern can't be resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /attendance/sessions/{id}:
    get:
      operationId: getAttendanceSession
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attendance register for a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAttendanceSession
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceSessionUpdate"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is cancelled, or a schedule change needs confirmation because attendance is already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/cancel:
    post:
      operationId: cancelAttendanceSession
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCancelInput"
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "400":
          description: Already cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attendance already recorded, confirm to cancel anyway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/delete:
    post:
      operationId: deleteAttendanceSession
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionDeleteInput"
      responses:
        "204":
          description: Session soft-deleted -- retained for audit, hidden from every report and listing
        "400":
          description: Already deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attendance already recorded, confirm to delete anyway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/expected-learners:
    get:
      operationId: getSessionExpectedLearners
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The session's expected-learner register snapshot
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExpectedLearner" }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/generate-register:
    post:
      operationId: generateSessionRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Register generated (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/refresh-register:
    post:
      operationId: refreshSessionRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRegisterInput"
      responses:
        "200":
          description: With confirm=false, a dry-run diff; with confirm=true, the applied result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RegisterRefreshDiff"
                  - $ref: "#/components/schemas/RegisterRefreshResult"
        "400":
          description: Session is cancelled, historical, or its register is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/register:
    put:
      operationId: saveAttendanceRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRegisterInput"
      responses:
        "200":
          description: Register saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is cancelled, register is locked, or the register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: One or more rows failed validation -- nothing was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/complete-register:
    post:
      operationId: completeRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRegisterInput"
      responses:
        "200":
          description: Register completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "409":
          description: Session is cancelled, register is locked, or the register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: One or more expected learners are missing or invalid attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/lock:
    post:
      operationId: lockAttendanceRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockRegisterInput"
      responses:
        "200":
          description: Register locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "400":
          description: Register is not completed, or already locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/unlock:
    post:
      operationId: unlockAttendanceRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRegisterInput"
      responses:
        "200":
          description: Register unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "400":
          description: Register is not locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/cover:
    put:
      operationId: assignCoverTutor
      tags: [attendance]
      description: >
        Upsert semantics: assigns a cover tutor when none is active, or
        changes the existing one. Administrator-only. Applies to this one
        session only -- the cohort's own tutor, learner allocations, and
        historical attendance authorship are never changed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverTutorInput"
      responses:
        "200":
          description: Cover tutor assigned or changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is cancelled, register is locked, or the register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Replacement tutor is invalid, inactive, the same as the original tutor, or "other" reason is missing notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/cover/remove:
    post:
      operationId: removeCoverTutor
      tags: [attendance]
      description: >
        Removes an active cover tutor. Administrator-only. Never deletes
        attendance already recorded while cover was active -- if any
        exists, requires confirmWithAttendance to proceed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveCoverTutorInput"
      responses:
        "200":
          description: Cover tutor removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "400":
          description: This session does not have a cover tutor assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is cancelled, register is locked, the register version is stale, or attendance is already recorded (confirm to proceed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/mark-all-present:
    post:
      operationId: markAllPresent
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: All learners marked present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "409":
          description: Session is cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Catch-up recording (Stage 3) ----------
  # Tutor-confirmed catch-up for a recorded absence -- stored entirely
  # separately from attendance_records (never replaces the original
  # status or adds to hours_attended). Every endpoint reuses the same
  # session-attendance-authority rules as the rest of attendance data.
  /attendance/sessions/{sessionId}/catchup/{learnerId}:
    get:
      operationId: getCatchupState
      tags: [catchup]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current catch-up state for this learner/session (live-derived, never a stored flag)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatchupState" }
        "403":
          description: Not allowed to access this session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Attendance session not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: recordCatchup
      tags: [catchup]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordCatchupInput" }
      responses:
        "200":
          description: Catch-up recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatchupState" }
        "400":
          description: Ineligible (not expected, not an eligible absence status, session cancelled/future, invalid completion date)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to write to this session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Catch-up already recorded for this learner/session -- use the correction action instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: correctCatchup
      tags: [catchup]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectCatchupInput" }
      responses:
        "200":
          description: Catch-up record corrected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatchupState" }
        "400":
          description: Invalid completion date, or missing note/reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to write to this session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No active catch-up record to correct
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /attendance/sessions/{sessionId}/catchup/{learnerId}/revoke:
    post:
      operationId: revokeCatchup
      tags: [catchup]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeCatchupInput" }
      responses:
        "200":
          description: Catch-up record revoked (history retained, never deleted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatchupState" }
        "400":
          description: Missing reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to write to this session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No active catch-up record to revoke
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /attendance/sessions/{sessionId}/catchup/{learnerId}/history:
    get:
      operationId: getCatchupHistory
      tags: [catchup]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Full audit trail (record/correct/revoke) for this learner/session's catch-up, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatchupHistoryEntry" }
        "403":
          description: Not allowed to access this session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /attendance/catchup/follow-up:
    get:
      operationId: listCatchupFollowUp
      tags: [catchup]
      description: >-
        Weekly absence-follow-up list (item 4) -- one row per absent
        learner/session pair, selected by the ORIGINAL session date range.
        A catch-up completed later still appears against that original
        absence. Read-only.
      parameters:
        - name: weekStart
          in: query
          required: true
          schema: { type: string, format: date }
        - name: weekEnd
          in: query
          required: true
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/CohortIdQueryParam"
        - $ref: "#/components/parameters/LearnerIdQueryParam"
        - name: status
          in: query
          schema: { type: string, enum: [outstanding, completed] }
        - name: search
          in: query
          description: Free-text learner-name filter, applied server-side before pagination.
          schema: { type: string }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Weekly absence-follow-up list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatchupFollowUpList" }
        "400":
          description: weekEnd before weekStart, or pageSize out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to filter by another tutor's cohort/learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------- Session participation report (Stage 3 catch-up feature) ----------
  # Session-based figures (distinct expected learner/session pairs) kept
  # entirely separate from the existing minutes-based attendancePercentage
  # above -- never blended, always separately labelled.
  /reports/participation:
    get:
      operationId: getParticipationReport
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/TutorIdQueryParam"
        - $ref: "#/components/parameters/CohortIdQueryParam"
        - $ref: "#/components/parameters/LearnerIdQueryParam"
      responses:
        "200":
          description: Session-based participation including catch-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionParticipationMetrics" }
        "403":
          description: Not allowed to access this scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /reports/participation/export:
    get:
      operationId: exportParticipationReport
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/TutorIdQueryParam"
        - $ref: "#/components/parameters/CohortIdQueryParam"
        - $ref: "#/components/parameters/LearnerIdQueryParam"
      responses:
        "200":
          description: CSV export of the session participation report (single summary row)
          content:
            text/csv:
              schema: { type: string }
        "403":
          description: Not allowed to export this scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------- Reports (Phase 9) ----------
  # All calculations here are backed by the same attendance_metrics engine
  # as /dashboard/* and /attendance-summary/* (Phase 8) -- report and
  # dashboard totals reconcile under identical filters by construction.
  /reports/learner/{learnerId}:
    get:
      operationId: getLearnerReportV2
      tags: [reports]
      parameters:
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Learner attendance report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerReportResponse" }
        "400":
          description: Invalid period/date range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to access this learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Learner not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /reports/learner/{learnerId}/export:
    get:
      operationId: exportLearnerReport
      tags: [reports]
      parameters:
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
      responses:
        "200":
          description: CSV export of this learner's session history
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: Export would exceed the maximum row limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to export this learner's report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /reports/cohort/{cohortId}:
    get:
      operationId: getCohortReportV2
      tags: [reports]
      parameters:
        - name: cohortId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Cohort attendance report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CohortReportResponse" }
        "400":
          description: Invalid period/date range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to access this cohort
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Cohort not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /reports/cohort/{cohortId}/export:
    get:
      operationId: exportCohortReport
      tags: [reports]
      parameters:
        - name: cohortId
          in: path
