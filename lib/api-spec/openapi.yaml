                items: { $ref: "#/components/schemas/AllocationHistoryEntry" }
  /allocation-reconciliation:
    get:
      operationId: getAllocationReconciliation
      tags: [allocation-reconciliation]
      description: >-
        Stage 1 operational allocation audit (admin only, read-only):
        reconciles Bud's "In Progress" learning-plan population against this
        app's active cohort allocations, using the same matching hierarchy
        as the Bud sync trial. Visibility only -- never writes anything.
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [assigned, unassigned, needs_review], default: assigned }
        - name: tutorSource
          in: query
          description: Which side of the reconciliation the tutor filter applies to -- see tutorValue.
          schema: { type: string, enum: [internal, bud] }
        - name: tutorValue
          in: query
          description: >-
            An internal tutor id (as a string) when tutorSource=internal, or
            a Bud tutor_name (or the literal "Unknown" for a blank/unmatched
            one) when tutorSource=bud.
          schema: { type: string }
        - name: programmeSource
          in: query
          description: Which side of the reconciliation the programme filter applies to -- see programmeValue.
          schema: { type: string, enum: [internal, bud] }
        - name: programmeValue
          in: query
          description: A programme name, or the literal "Unknown" for a blank one.
          schema: { type: string }
        - name: search
          in: query
          description: Case-insensitive substring match against learner name or learner reference.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Allocation reconciliation results for the requested view (admin only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationReconciliationResponse" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /allocation-reconciliation/population-summary:
    get:
      operationId: getAllocationReconciliationPopulationSummary
      tags: [allocation-reconciliation]
      description: >-
        Stage 2 corrected, same-snapshot Stage 1 population summary (admin
        only, read-only). Replaces the original completion report's
        mislabelled "220"/"429"/"191" comparison figures with populations
        computed fresh and named for what they actually are.
      responses:
        "200":
          description: Corrected population summary (admin only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationReconciliationPopulationSummary" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /allocation-reconciliation/multiple-plan-breakdown:
    get:
      operationId: getAllocationReconciliationMultiplePlanBreakdown
      tags: [allocation-reconciliation]
      description: >-
        Stage 2, item 7 (admin only, read-only): for learners with one
        current In Progress Bud plan plus historical plans, whether an
        existing Bud link points at the current plan, a historical one, or
        doesn't exist. Read-only visibility -- never relinks anything.
      responses:
        "200":
          description: Multiple-plan link breakdown (admin only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationReconciliationMultiplePlanBreakdown" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
