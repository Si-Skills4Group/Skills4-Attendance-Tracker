      properties:
        id: { type: integer }
        learnerId: { type: integer }
        maths: { type: boolean }
        english: { type: boolean }
        status:
          description: recorded = an active requirement is on file. cleared = an admin explicitly removed it (row retained, history preserved) -- never confused with "no requirement data uploaded" (a null response, no row at all).
          type: string
          enum: [recorded, cleared]
        source: { type: string, enum: [manual_upload] }
        importBatchId: { oneOf: [{ type: integer }, { type: "null" }] }
        updatedBy: { type: integer }
        updatedAt: { type: string, format: date-time }
