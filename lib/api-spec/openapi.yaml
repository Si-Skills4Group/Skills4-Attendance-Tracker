          id, jobId, rowNumber, rawData, normalizedAim, matchedLearnerId, outcome,
          existingMaths, existingEnglish, existingStatus, proposedMaths, proposedEnglish,
          errors, warnings, importResult, createdAt,
        ]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        rowNumber: { type: integer }
        rawData:
          type: object
          additionalProperties: { type: string }
          description: The raw CSV row verbatim, keyed by its literal headers (learnerID, AIM).
        normalizedAim:
          oneOf: [{ type: string, enum: [math, english, both] }, { type: "null" }]
        matchedLearnerId: { oneOf: [{ type: integer }, { type: "null" }] }
        matchedLearnerName:
          oneOf: [{ type: string }, { type: "null" }]
          description: Looked up live against the current learner record, not persisted -- reflects the learner's name as of this read, not at upload time.
        matchedLearnerStatus:
          oneOf: [{ type: string, enum: [active, withdrawn, completed, paused] }, { type: "null" }]
          description: Looked up live against the current learner record, not persisted.
        outcome: { $ref: "#/components/schemas/FsRequirementRowOutcome" }
        existingMaths: { oneOf: [{ type: boolean }, { type: "null" }] }
        existingEnglish: { oneOf: [{ type: boolean }, { type: "null" }] }
        existingStatus: { oneOf: [{ type: string, enum: [recorded, cleared] }, { type: "null" }] }
        proposedMaths: { oneOf: [{ type: boolean }, { type: "null" }] }
        proposedEnglish: { oneOf: [{ type: boolean }, { type: "null" }] }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        importResult: { oneOf: [{ type: string }, { type: "null" }] }
        createdAt: { type: string, format: date-time }

    FsRequirementImportJobRowListResponse:
      type: object
      required: [items, total, page, pageSize]
