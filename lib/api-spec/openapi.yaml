  # ---------- Learner engagement recency (Stage 4) ----------
  # Combines four SEPARATE evidence signals (live attendance, Bud
  # submission, Bud completed activity, Stage 3 confirmed catch-up) into
  # one "latest recorded engagement" date per learner -- see
  # engagement_lib.py for the full source-selection/permission design.
  # Summary/export are registered before the {learnerId} detail route so
  # they are never shadowed by it.
  /reports/engagement-recency/summary:
    get:
      operationId: getEngagementRecencySummary
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/TutorIdQueryParam"
        - $ref: "#/components/parameters/CohortIdQueryParam"
      responses:
        "200":
          description: Compact engagement-recency counts for the caller's authorised scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementRecencySummary" }
        "403":
          description: Not allowed to access this scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /reports/engagement-recency/export:
    get:
      operationId: exportEngagementRecency
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/TutorIdQueryParam"
        - $ref: "#/components/parameters/CohortIdQueryParam"
        - name: programme
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: noEngagementOnly
          in: query
          schema: { type: boolean, default: false }
        - name: minDaysSince
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: CSV export of the full filtered authorised engagement-recency results (streamed)
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: Export would exceed the maximum row limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to export this scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /reports/engagement-recency:
    get:
      operationId: listEngagementRecency
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/TutorIdQueryParam"
        - $ref: "#/components/parameters/CohortIdQueryParam"
        - name: programme
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: noEngagementOnly
          in: query
          schema: { type: boolean, default: false }
        - name: minDaysSince
          in: query
          description: "\"At least N days since engagement\" -- always excludes learners with no recorded engagement at all (kept distinct, never swept in by an implicit \"infinite days\")."
          schema: { type: integer, minimum: 0 }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: One row per learner in the caller's authorised scope, worst-first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementRecencyList" }
        "403":
          description: Not allowed to access this scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /reports/engagement-recency/{learnerId}:
    get:
      operationId: getEngagementRecencyDetail
      tags: [reports]
      description: >-
        Traceability drill-down (item 6): the exact same combination rule
        as the list, with full supporting-evidence references. This is a
        current view of available evidence, not a reconstruction of what
        was known on any historical date.
      parameters:
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Full engagement-recency detail with supporting evidence for one learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementRecencyDetail" }
        "403":
          description: Not allowed to access this learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Learner not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

