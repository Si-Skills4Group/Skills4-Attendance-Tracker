          effectiveDate,
          effectiveTo,
          transferReason,
          changedBy,
          changedByName,
          changedDate,
        ]
      properties:
        id: { type: integer }
        learnerId: { type: integer }
        learnerName: { type: string }
        previousTutorId: { type: ["integer", "null"] }
        previousTutorName: { type: ["string", "null"] }
        newTutorId: { type: ["integer", "null"] }
        newTutorName: { type: ["string", "null"] }
        previousCohortId: { type: ["integer", "null"] }
        previousCohortName: { type: ["string", "null"] }
        newCohortId: { type: ["integer", "null"] }
        newCohortName: { type: ["string", "null"] }
        effectiveDate: { type: string, format: date }
        effectiveTo:
          description: The next chronological transfer's effective date for this learner, or null if this is their current allocation.
          type: ["string", "null"]
