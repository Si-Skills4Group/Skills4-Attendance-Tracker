        updated: { type: integer }
        scheduled: { type: integer }

    CancelScheduledAllocationResult:
      type: object
      required: [cancelled]
      properties:
        cancelled: { type: boolean }

    AttendanceSession:
      type: object
      required:
        [
          id,
          cohortId,
          cohortName,
          tutorId,
          tutorName,
          sessionDate,
          plannedStartTime,
          plannedEndTime,
          plannedDurationHours,
          title,
          notes,
          status,
          cancelledAt,
          cancellationReason,
          overrideReason,
          recordedCount,
          expectedCount,
          registerStatus,
          registerVersion,
          completedAt,
          completedBy,
          registerLockedAt,
          registerLockedBy,
          lockReason,
          coverTutorId,
          coverTutorName,
          coverOriginalTutorId,
          coverOriginalTutorName,
          coverReason,
          coverNotes,
          coverAssignedAt,
          coverAssignedByName,
          effectiveTutorId,
          effectiveTutorName,
          createdBy,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        cohortId: { type: integer }
        cohortName: { type: string }
        tutorId: { type: integer }
        tutorName: { type: string }
        sessionDate: { type: string, format: date }
        plannedStartTime: { type: string }
        plannedEndTime: { type: string }
        plannedDurationHours: { type: number }
        title: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/SessionStatus" }
        cancelledAt: { type: ["string", "null"], format: date-time }
        cancellationReason: { type: ["string", "null"] }
        overrideReason: { type: ["string", "null"] }
        recordedCount: { type: integer }
        expectedCount: { type: integer }
        registerStatus: { $ref: "#/components/schemas/RegisterStatus" }
        registerVersion: { type: integer }
        # Populated only where _with_counts computes it (all single-session
        # reads/writes) -- deliberately absent from the plain sessions-list
        # endpoint's response to avoid an extra query per listed row, so
        # neither field is required.
        rosterSyncedAt: { type: ["string", "null"], format: date-time }
        rosterMayHaveChanged: { type: boolean }
        completedAt: { type: ["string", "null"], format: date-time }
        completedBy: { type: ["integer", "null"] }
        registerLockedAt: { type: ["string", "null"], format: date-time }
        registerLockedBy: { type: ["integer", "null"] }
        lockReason: { type: ["string", "null"] }
        # Session-level cover tutor reassignment: coverTutorId is the sole
        # "is this session covered" signal (null = no cover). tutorId/
        # tutorName keep their existing meaning (the cohort's own tutor)
        # unchanged -- effectiveTutorId/effectiveTutorName are the ready-
        # made "who is actually delivering this session" display values
        # (cover tutor when active, otherwise the cohort's tutor).
        coverTutorId: { type: ["integer", "null"] }
        coverTutorName: { type: ["string", "null"] }
        coverOriginalTutorId: { type: ["integer", "null"] }
        coverOriginalTutorName: { type: ["string", "null"] }
        coverReason: { type: ["string", "null"] }
        coverNotes: { type: ["string", "null"] }
        coverAssignedAt: { type: ["string", "null"], format: date-time }
        coverAssignedByName: { type: ["string", "null"] }
        effectiveTutorId: { type: integer }
        effectiveTutorName: { type: string }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AttendanceSessionInput:
      type: object
      required:
        [
          cohortId,
          sessionDate,
          plannedStartTime,
          plannedEndTime,
          plannedDurationHours,
          title,
        ]
      properties:
        cohortId: { type: integer }
        sessionDate: { type: string, format: date }
        plannedStartTime: { type: string, minLength: 1 }
        plannedEndTime: { type: string, minLength: 1 }
        plannedDurationHours: { type: number, minimum: 0 }
        title: { type: string, minLength: 1 }
        notes: { type: string }
        force: { type: boolean, default: false }
        overrideReason: { type: string }

    DayOfWeek:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

    SessionOccurrence:
      type: string
      enum: [weekly, biweekly, monthly]
      description: >-
        monthly means the same weekday POSITION each month (e.g. a first
        session on the month's 2nd Tuesday repeats on each later month's
        own 2nd Tuesday) -- never a fixed 28-day interval, and a month with
        no such position (e.g. no 5th Friday) is skipped, never substituted.

    GenerateSessionsInput:
      type: object
      required:
        [
          cohortId,
          dayOfWeek,
          occurrence,
          plannedStartTime,
          plannedEndTime,
          plannedDurationHours,
          firstSessionDate,
          finalSessionDate,
          title,
        ]
      properties:
        cohortId: { type: integer }
        dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
        occurrence: { $ref: "#/components/schemas/SessionOccurrence" }
        plannedStartTime: { type: string, minLength: 1 }
        plannedEndTime: { type: string, minLength: 1 }
        plannedDurationHours: { type: number, minimum: 0 }
        firstSessionDate:
          type: string
          format: date
          description: Must fall on the chosen dayOfWeek.
        finalSessionDate: { type: string, format: date }
        title: { type: string, minLength: 1 }
        notes: { type: string }

    GenerateSessionsPreviewDate:
      type: object
      required: [sessionDate, conflict]
      properties:
        sessionDate: { type: string, format: date }
        conflict:
          type: boolean
          description: True when this date will be skipped on confirm rather than created -- see conflictReason for why.
        conflictReason:
          type: string
          nullable: true
          enum: [duplicate_session, outside_cohort_date_range]
          description: Why this date is flagged as a conflict; null when conflict is false.

    GenerateSessionsPreview:
      type: object
      required: [dates, newCount, conflictCount]
      properties:
        dates:
          type: array
          items: { $ref: "#/components/schemas/GenerateSessionsPreviewDate" }
        newCount: { type: integer }
        conflictCount: { type: integer }

    GenerateSessionsResult:
      type: object
      required: [createdCount, createdIds, skippedDates]
      properties:
        createdCount: { type: integer }
        createdIds:
          type: array
          items: { type: integer }
        skippedDates:
          type: array
          items: { type: string, format: date }

    AttendanceSessionUpdate:
      type: object
      properties:
        sessionDate: { type: string, format: date }
        plannedStartTime: { type: string, minLength: 1 }
        plannedEndTime: { type: string, minLength: 1 }
        plannedDurationHours: { type: number, minimum: 0 }
        title: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        confirmChange: { type: boolean, default: false }

    SessionCancelInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
        confirmWithAttendance: { type: boolean, default: false }

    SessionDeleteInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
        confirmWithAttendance: { type: boolean, default: false }

    RefreshRegisterInput:
      type: object
      properties:
        confirm: { type: boolean, default: false }
        reason: { type: string }

    CompleteRegisterInput:
      type: object
      required: [registerVersion]
      properties:
        registerVersion: { type: integer }

    LockRegisterInput:
      type: object
      required: [reason, registerVersion]
      properties:
        reason: { type: string, minLength: 1 }
        registerVersion: { type: integer }

    CoverReason:
      type: string
      enum:
        [
          tutor_sickness,
          annual_leave,
          emergency_cover,
          tutor_unavailable,
          operational_reassignment,
          other,
        ]

    CoverTutorInput:
      type: object
      required: [coverTutorId, reason, registerVersion]
      properties:
        coverTutorId: { type: integer }
        reason: { $ref: "#/components/schemas/CoverReason" }
        notes: { type: string }
        registerVersion: { type: integer }

    RemoveCoverTutorInput:
      type: object
      required: [reason, registerVersion]
      properties:
        reason: { type: string, minLength: 1 }
        confirmWithAttendance: { type: boolean, default: false }
        registerVersion: { type: integer }

    UnlockRegisterInput:
      type: object
      required: [reason, registerVersion]
      properties:
        reason: { type: string, minLength: 1 }
        registerVersion: { type: integer }

    ExpectedLearner:
      type: object
      required: [learnerId, learnerName]
      properties:
        learnerId: { type: integer }
        learnerName: { type: string }
        learnerRef: { type: string }
        functionalSkillsSubjects:
          type: array
          items: { $ref: "#/components/schemas/FunctionalSkillsSubject" }
          description: >-
