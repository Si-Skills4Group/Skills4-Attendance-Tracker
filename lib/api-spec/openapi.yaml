    get:
      operationId: listAuditLog
      tags: [audit]
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: integer }
        - name: userId
          in: query
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  # ---------- Settings ----------
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /tutor-identity/diagnostics:
    get:
      operationId: getTutorIdentityDiagnostics
      tags: [tutor-identity]
      description: >-
        Stage 2 (admin only, read-only): Bud tutor identifiers with no
        valid internal mapping, held only by an inactive tutor record,
        attached to more than one internal tutor record, and potential
        duplicate tutor records for human review. Never merges or changes
        anything -- see tutor_identity_lib.py's module docstring.
      responses:
        "200":
          description: Tutor identity diagnostics (admin only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorIdentityDiagnostics" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /tutor-identity/mapping-corrections/preview:
    post:
      operationId: previewTutorMappingCorrection
      tags: [tutor-identity]
      description: >-
        Stage 2 (admin only, read-only): previews reassigning a Bud tutor
        identifier from one internal tutor record to another. Writes
        nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorMappingCorrectionPreviewRequest" }
      responses:
        "200":
          description: Preview of the proposed correction (admin only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorMappingCorrectionPreview" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Source or target tutor not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /tutor-identity/mapping-corrections/commit:
    post:
      operationId: commitTutorMappingCorrection
      tags: [tutor-identity]
      description: >-
        Stage 2 (admin only): applies a previewed tutor mapping correction.
        Requires a non-blank reason and the exact updated_at values the
        preview showed for both tutors (rejected with 409 if either has
        changed since). Atomic; writes an audit_logs entry with
        before/after values; never touches learners, cohorts, or attendance,
        and never triggers a Bud learner-sync commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorMappingCorrectionCommitRequest" }
      responses:
        "200":
          description: Correction applied (admin only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorMappingCorrectionResult" }
        "400":
          description: Missing reason, or source/target are the same record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Stale preview, or the Bud identifier is now held by another tutor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /bud-missing-source/exceptions:
    get:
      operationId: getBudMissingSourceExceptions
      tags: [bud-missing-source]
      description: >-
        Stage 2, item 6 (admin only, READ-ONLY): reverse-presence
        exceptions for previously-linked, internally active learners whose
        linked Bud learning-plan row is missing from the source. Lists
        whatever the last POST /bud-missing-source/refresh detected --
        never triggers detection itself. Never infers completion/
        withdrawal/deletion or changes a learner's status.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved], default: open }
      responses:
        "200":
          description: Reverse-presence exceptions (admin only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudMissingSourceExceptionList" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /bud-missing-source/refresh:
    post:
      operationId: refreshBudMissingSource
      tags: [bud-missing-source]
      description: >-
        Stage 2, item 6 (admin only): runs reverse-presence detection now,
        transactionally and idempotently, and returns the updated refresh
        status. A failure here never discards the last successful results
        -- only last_attempted_at/last_error move; last_succeeded_at and
        the exceptions themselves are untouched.
      responses:
        "200":
          description: Updated refresh status (admin only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudMissingSourceRefreshStatus" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /bud-sync/status:
    get:
      operationId: getBudSyncStatus
      tags: [bud-sync]
      responses:
        "200":
          description: Current Bud source status and the active trial baseline, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncStatus"
  /bud-sync/baseline:
    post:
      operationId: establishBudSyncBaseline
      tags: [bud-sync]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudSyncBaselineInput"
      responses:
        "201":
          description: Trial baseline established -- no learners, cohorts, or allocations are created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncBaseline"
        "409":
          description: A trial baseline is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/baseline/reset:
    post:
      operationId: resetBudSyncBaseline
      tags: [bud-sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudSyncBaselineResetInput"
      responses:
        "201":
          description: Previous baseline superseded (never deleted) and a new one established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncBaseline"
        "409":
          description: No active baseline to reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/baseline/history:
    get:
      operationId: getBudSyncBaselineHistory
      tags: [bud-sync]
      responses:
        "200":
          description: Every baseline ever established, newest first -- superseded baselines are kept, never deleted
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BudSyncBaseline" }
  /bud-sync/preview:
    post:
      operationId: createBudSyncPreview
      tags: [bud-sync]
      responses:
        "201":
          description: >-
            Read-only classification of every Bud source row against the active
            baseline -- writes only trial bookkeeping (the job and its items),
            never a learner, cohort, or allocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncJob"
        "409":
          description: No active trial baseline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/jobs:
    get:
      operationId: listBudSyncJobs
      tags: [bud-sync]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Paginated sync job history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncJobListResponse"
  /bud-sync/jobs/{jobId}:
    get:
      operationId: getBudSyncJob
      tags: [bud-sync]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sync job status and summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/jobs/{jobId}/summary:
    get:
      operationId: getBudSyncJobSummary
      tags: [bud-sync]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Backend-computed actionable-queue counts for the dashboard summary cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncJobSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/jobs/{jobId}/items:
    get:
      operationId: listBudSyncJobItems
      tags: [bud-sync]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
        - name: matchStatus
          in: query
          schema: { $ref: "#/components/schemas/BudSyncMatchStatus" }
        - name: actionType
          in: query
          schema: { $ref: "#/components/schemas/BudSyncActionType" }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Paginated proposed items for this sync job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncItemListResponse"
  /bud-sync/jobs/{jobId}/items/bulk-approve:
    post:
      operationId: bulkApproveBudSyncJobItems
      tags: [bud-sync]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudSyncBulkApproveInput"
      responses:
        "200":
          description: >-
            New Learners tab's bulk action -- approves many 'new' items at
            once, each supplying its own learnerRef/level. Partial success:
            one bad row is reported in errors and skipped, not a whole-batch
            failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncBulkApproveResult"
        "404":
          description: Sync job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job is not in a reviewable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/jobs/{jobId}/items/{itemId}:
    patch:
      operationId: updateBudSyncJobItem
      tags: [bud-sync]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudSyncItemUpdateInput"
      responses:
        "200":
          description: Item updated (Administrator-supplied field, and/or approval toggled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncItem"
        "400":
          description: Conflicted item cannot be approved, or required fields are still missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/jobs/{jobId}/items/{itemId}/link-existing:
    post:
      operationId: linkBudSyncJobItemToExistingLearner
      tags: [bud-sync]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudSyncLinkExistingInput"
      responses:
        "200":
          description: >-
            New Learners tab's "mark as already represented" action -- links
            this Bud row to an existing Attendance learner the Administrator
            picked, instead of creating a new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncJob"
        "400":
          description: Only a 'new' item can be manually linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The chosen learner is already linked to a different Bud record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/jobs/{jobId}/commit:
    post:
      operationId: commitBudSyncJob
      tags: [bud-sync]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudSyncCommitInput"
      responses:
        "200":
          description: >-
            Approved items applied transactionally (or, if already completed,
            the same stored result -- committing is idempotent). Stale
            items (source or internal data changed since preview) are
            excluded rather than applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncJob"
        "400":
          description: Conflicted or incomplete items were selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job not ready to commit, baseline changed since preview, or a trial limit was exceeded without an override reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bud-sync/unmatched-pre-baseline:
    get:
      operationId: listBudSyncUnmatchedPreBaseline
      tags: [bud-sync]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: >-
            Read-only awareness list of Bud rows present at-or-before the
            active baseline -- excluded from the trial by design, never
            processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudSyncUnmatchedPreBaselineResponse"

components:
  parameters:
    PeriodParam:
      name: period
      in: query
      schema:
        type: string
        enum: [current_week, current_month, previous_month, last_30_days, custom]
        default: current_month
    DateFromParam:
      name: dateFrom
      in: query
      schema: { type: string, format: date }
    DateToParam:
      name: dateTo
      in: query
      schema: { type: string, format: date }
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, default: 25 }
    TutorIdQueryParam:
      name: tutorId
      in: query
      schema: { type: integer }
    CohortIdQueryParam:
      name: cohortId
      in: query
      schema: { type: integer }
    LearnerIdQueryParam:
      name: learnerId
      in: query
      schema: { type: integer }
    ProgrammeQueryParam:
      name: programme
      in: query
      schema: { type: string }
    LevelQueryParam:
      name: level
      in: query
      schema: { type: string }
    EmployerQueryParam:
      name: employer
      in: query
      schema: { type: string }
    SubjectQueryParam:
      name: subject
      in: query
      description: Filters to a Functional Skills cohort's subject (math/english/both) -- a 'primary' cohort's sessions never match.
      schema: { $ref: "#/components/schemas/FunctionalSkillsSubject" }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    UserRole:
      type: string
      enum: [admin, tutor]

    LearnerStatus:
      type: string
      enum: [active, withdrawn, completed, paused]

    AttendanceStatus:
      type: string
      enum:
        - present
        - absent_authorised
        - absent_unauthorised
        - late
        - not_expected
        - withdrawn
        - bil

    SessionStatus:
      type: string
      enum:
        - scheduled
        - cancelled

    RegisterStatus:
      type: string
      enum:
        - not_started
        - in_progress
        - completed
        - cancelled
        - locked

    DeliveryDay:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    AuthUser:
      type: object
      required: [id, firstName, lastName, email, role, active]
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        displayName: { type: ["string", "null"] }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        active: { type: boolean }
        tutorId: { type: ["integer", "null"] }
        entraObjectId: { type: ["string", "null"] }
        entraTenantId: { type: ["string", "null"] }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }

    UserProvisionInput:
      type: object
      required: [entraObjectId, entraTenantId, email, firstName, role]
      properties:
        entraObjectId: { type: string, minLength: 1 }
        entraTenantId: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        tutorId: { type: ["integer", "null"] }
        active: { type: boolean, default: true }

    UserUpdateInput:
      type: object
      properties:
        email: { type: string, minLength: 1 }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string }
        displayName: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/UserRole" }
        tutorId: { type: ["integer", "null"] }
        active: { type: boolean }

    UserRoleInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/UserRole" }

    UserLinkTutorInput:
      type: object
      properties:
        tutorId: { type: ["integer", "null"] }

    Tutor:
      type: object
      required:
        [
          id,
          userId,
          firstName,
          lastName,
          email,
          employeeRef,
          phone,
          active,
          externalSystemId,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        userId: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        employeeRef: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        active: { type: boolean }
        externalSystemId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TutorInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        employeeRef: { type: string, minLength: 1 }
        phone: { type: string }
        active: { type: boolean, default: true }
        externalSystemId: { type: string }

    TutorUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        employeeRef: { type: string, minLength: 1 }
        phone: { type: string }
        active: { type: boolean }
        externalSystemId: { type: string }

    Learner:
      type: object
      required:
        [
          id,
          learnerRef,
          uln,
          firstName,
          lastName,
          email,
          employer,
          programme,
          level,
          startDate,
          plannedEndDate,
          actualEndDate,
          withdrawalDate,
          status,
          tutorId,
          cohortId,
          tutorName,
          cohortName,
          externalSystemId,
          functionalSkillsSubjects,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        learnerRef: { type: string }
        uln: { type: ["string", "null"] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: ["string", "null"] }
        employer: { type: ["string", "null"] }
        programme: { type: string }
        level: { type: string }
        startDate: { type: string, format: date }
        plannedEndDate: { type: ["string", "null"], format: date }
        actualEndDate: { type: ["string", "null"], format: date }
        withdrawalDate: { type: ["string", "null"], format: date }
        status: { $ref: "#/components/schemas/LearnerStatus" }
        tutorId: { type: ["integer", "null"] }
        cohortId: { type: ["integer", "null"] }
        tutorName: { type: ["string", "null"] }
        cohortName: { type: ["string", "null"] }
        externalSystemId: { type: ["string", "null"] }
        functionalSkillsSubjects:
          type: array
          items: { $ref: "#/components/schemas/FunctionalSkillsSubject" }
          description: >-
            Distinct subjects of this learner's currently active Functional
            Skills secondary enrollments -- empty when they have none.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FunctionalSkillsSubject:
      type: string
      enum: [math, english, both]

    CohortLearner:
      description: >-
        A Learner as listed on a specific cohort's own roster, with the one
        extra field ("is this learner here via an active Functional Skills
        enrollment into THIS cohort, and if so which enrollment") that's only
        meaningful in the context of one particular cohort.
      allOf:
        - $ref: "#/components/schemas/Learner"
        - type: object
          required: [secondaryEnrollmentId]
          properties:
            secondaryEnrollmentId:
              type: ["integer", "null"]
              description: >-
                Null when this learner is on the roster via their home
                cohort. The learner_cohort_enrollments row id when they're
                here via an active Functional Skills secondary enrollment
                into this cohort -- use this to end that enrollment (e.g.
                marking the course completed) without affecting their
                uploaded Functional Skills requirement or any other cohort.

    LearnerInput:
      type: object
      required: [learnerRef, firstName, lastName, programme, level, startDate]
      properties:
        learnerRef: { type: string, minLength: 1 }
        uln: { type: string }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        employer: { type: string }
        programme: { type: string, minLength: 1 }
        level: { type: string, minLength: 1 }
        startDate: { type: string, format: date }
        plannedEndDate: { type: string, format: date }
        actualEndDate: { type: string, format: date }
        withdrawalDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/LearnerStatus" }
