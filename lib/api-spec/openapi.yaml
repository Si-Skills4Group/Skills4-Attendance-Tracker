        added:
          type: array
          items: { $ref: "#/components/schemas/ExpectedLearner" }
        removed:
          type: array
          items: { $ref: "#/components/schemas/ExpectedLearner" }
        blocked:
          type: array
          items: { $ref: "#/components/schemas/ExpectedLearner" }

    RegisterEntry:
