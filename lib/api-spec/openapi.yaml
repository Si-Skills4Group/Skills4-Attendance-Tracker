        changedByName: { type: string }
        changedDate: { type: string, format: date-time }

    AllocationHistoryReportResponse:
      type: object
      required: [items, total, page, pageSize, notice]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AllocationHistoryRow" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        notice: { type: string }

    SessionSummary:
      type: object
      required: [id, cohortId, cohortName, sessionDate, tutorName, isCoverSession]
      properties:
        id: { type: integer }
        cohortId: { type: integer }
        cohortName: { type: string }
        sessionDate: { type: string, format: date }
        # Already the effective tutor (cover tutor when active, otherwise
        # the cohort's own tutor) -- isCoverSession lets the UI label it.
        tutorName: { type: string }
        isCoverSession: { type: boolean }

    RecentEdit:
      type: object
      required:
        [id, sessionId, cohortName, learnerName, status, editedBy, editedAt]
      properties:
        id: { type: integer }
        sessionId: { type: integer }
        cohortName: { type: string }
        learnerName: { type: string }
        status: { $ref: "#/components/schemas/AttendanceStatus" }
        editedBy: { type: string }
        editedAt: { type: string, format: date-time }

    CohortSummary:
      type: object
      required: [cohort, learnerCount, attendancePercentage]
      properties:
        cohort: { $ref: "#/components/schemas/Cohort" }
        learnerCount: { type: integer }
        attendancePercentage: { type: number }

    AdminDashboard:
      type: object
      required:
        [
          activeLearners,
          activeTutors,
          activeCohorts,
          attendancePercentageWeek,
          attendancePercentageMonth,
          participationPercentageWeek,
          participationPercentageMonth,
          sessionsAwaitingCompletion,
          recentlyEditedAttendance,
          lowAttendanceLearners,
        ]
      properties:
        activeLearners: { type: integer }
        activeTutors: { type: integer }
        activeCohorts: { type: integer }
        attendancePercentageWeek: { type: number }
        attendancePercentageMonth: { type: number }
        participationPercentageWeek:
          type: number
          description: Live attendance plus effective (non-revoked) catch-up completions, as a share of expected sessions -- distinct from attendancePercentage*, which never includes catch-up.
        participationPercentageMonth:
          type: number
          description: Live attendance plus effective (non-revoked) catch-up completions, as a share of expected sessions -- distinct from attendancePercentage*, which never includes catch-up.
        sessionsAwaitingCompletion:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
        recentlyEditedAttendance:
          type: array
          items: { $ref: "#/components/schemas/RecentEdit" }
        lowAttendanceLearners:
          type: array
          items: { $ref: "#/components/schemas/LearnerAttendanceSummaryRow" }

    TutorDashboard:
      type: object
      required:
        [
          cohorts,
          nextSession,
          sessionsAwaitingCompletion,
          lowAttendanceLearners,
          attendancePercentageWeek,
          attendancePercentageMonth,
          participationPercentageWeek,
          participationPercentageMonth,
        ]
      properties:
        cohorts:
          type: array
          items: { $ref: "#/components/schemas/CohortSummary" }
        nextSession:
          oneOf:
            - $ref: "#/components/schemas/SessionSummary"
            - type: "null"
        sessionsAwaitingCompletion:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
        lowAttendanceLearners:
          type: array
          items: { $ref: "#/components/schemas/LearnerAttendanceSummaryRow" }
        attendancePercentageWeek: { type: number }
        attendancePercentageMonth: { type: number }
        participationPercentageWeek:
          type: number
          description: Live attendance plus effective (non-revoked) catch-up completions, as a share of expected sessions -- distinct from attendancePercentage*, which never includes catch-up.
        participationPercentageMonth:
          type: number
          description: Live attendance plus effective (non-revoked) catch-up completions, as a share of expected sessions -- distinct from attendancePercentage*, which never includes catch-up.

    # ---------- Phase 8: attendance calculations and dashboards ----------

    AttendanceMetrics:
      type: object
      required:
        [
          periodStart,
          periodEnd,
          expectedMinutes,
          attendedMinutes,
          authorisedAbsenceMinutes,
          authorisedAbsenceSessions,
          unauthorisedAbsenceMinutes,
          unauthorisedAbsenceSessions,
          lateMinutes,
          lateSessionCount,
          averageMinutesLate,
          missingRecordCount,
          completedRegisterRowCount,
          attendancePercentage,
          attendanceDataCompleteness,
          insufficientData,
          calculatedAt,
        ]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        expectedMinutes: { type: number }
        attendedMinutes: { type: number }
        authorisedAbsenceMinutes: { type: number }
        authorisedAbsenceSessions: { type: integer }
        unauthorisedAbsenceMinutes: { type: number }
        unauthorisedAbsenceSessions: { type: integer }
        lateMinutes: { type: integer }
        lateSessionCount: { type: integer }
        averageMinutesLate:
          oneOf:
            - type: number
            - type: "null"
        missingRecordCount: { type: integer }
        completedRegisterRowCount: { type: integer }
        attendancePercentage:
          description: Null when expectedMinutes is zero -- never a fabricated 0%.
          oneOf:
            - type: number
            - type: "null"
        attendanceDataCompleteness:
          description: Percentage of applicable register rows that have an actual recorded status (vs missing).
          oneOf:
            - type: number
            - type: "null"
        insufficientData:
          description: True when there isn't enough recorded data to trust attendancePercentage (see the low-attendance minimum-data rule).
          type: boolean
        calculatedAt: { type: string, format: date-time }

    SessionParticipationMetrics:
      type: object
      description: >-
        Session-based figures (distinct expected learner/session pairs),
        entirely separate from AttendanceMetrics' minutes-based
        attendancePercentage above. totalParticipation = liveAttendedLearnerSessions
        + caughtUp. participationRate = totalParticipation / expectedLearnerSessions
        * 100, null when expectedLearnerSessions is zero. recordedAbsences and
        caughtUp intentionally overlap (caughtUp is a subset of recordedAbsences).
      required:
        [
          periodStart,
          periodEnd,
          expectedLearnerSessions,
          liveAttendedLearnerSessions,
          recordedAbsences,
          caughtUp,
          absencesWithoutCatchup,
          attendanceNotRecorded,
          totalParticipation,
          participationRate,
          calculatedAt,
        ]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        expectedLearnerSessions: { type: integer }
        liveAttendedLearnerSessions: { type: integer, description: "Present or late (late counts as one attended learner-session, not full minutes)." }
        recordedAbsences: { type: integer, description: "Authorised or unauthorised, regardless of catch-up." }
        caughtUp: { type: integer, description: "Subset of recordedAbsences with an effective confirmed catch-up." }
        absencesWithoutCatchup: { type: integer }
        attendanceNotRecorded: { type: integer }
        totalParticipation: { type: integer }
        participationRate:
          description: Null when expectedLearnerSessions is zero -- never a fabricated 0%.
          oneOf:
            - type: number
            - type: "null"
        calculatedAt:
          type: string
          format: date-time
          description: >-
            When this figure was produced. Catch-up known as of this moment
            only -- a later catch-up confirmation can raise an earlier
            period's participation on a subsequent call.

    CatchupMethod:
      type: string
      enum: [recording_watched, activity_completed]

    RecordCatchupInput:
      type: object
      required: [completionDate, method, note]
      properties:
        completionDate: { type: string, format: date }
        method: { $ref: "#/components/schemas/CatchupMethod" }
        note:
          type: string
          description: Required tutor-entered description of the completion evidence or activity -- this is tutor confirmation, not automated tracking.

    CorrectCatchupInput:
      type: object
      required: [completionDate, method, note, reason]
      properties:
        completionDate: { type: string, format: date }
        method: { $ref: "#/components/schemas/CatchupMethod" }
        note: { type: string }
        reason:
          type: string
          description: Required reason for the correction, retained in the audit history.

    RevokeCatchupInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Required reason for the revocation, retained in the audit history.

    CatchupRecord:
      type: object
      required:
        [
          id,
          sessionId,
          learnerId,
          status,
          completionDate,
          method,
          note,
          originalStatusAtRecording,
          recordedBy,
          recordedAt,
        ]
      properties:
        id: { type: integer }
        sessionId: { type: integer }
        learnerId: { type: integer }
        status: { type: string, enum: [recorded, revoked] }
        completionDate: { type: string, format: date }
        method: { $ref: "#/components/schemas/CatchupMethod" }
        note: { type: string }
        originalStatusAtRecording:
          description: The attendance status this catch-up was recorded against at the time -- retained even if the original attendance is later corrected.
          $ref: "#/components/schemas/AttendanceStatus"
        recordedBy: { type: integer }
        recordedAt: { type: string, format: date-time }
        lastUpdatedBy: { oneOf: [{ type: integer }, { type: "null" }] }
        updatedAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        revokedAt: { oneOf: [{ type: string, format: date-time }, { type: "null" }] }
        revokedBy: { oneOf: [{ type: integer }, { type: "null" }] }
        revocationReason: { oneOf: [{ type: string }, { type: "null" }] }

    CatchupState:
      type: object
      description: >-
        The live-derived "does this catch-up currently count" state --
        never a stored flag. Returned by the GET endpoint and by every
        write endpoint's response.
      required: [catchup, effective, ineligibleReason]
      properties:
        catchup:
          oneOf:
            - $ref: "#/components/schemas/CatchupRecord"
            - type: "null"
          description: Null when no catch-up has ever been recorded for this learner/session. "Not recorded" must never be presented as proof the learner did no work.
        effective:
          type: boolean
          description: True only when the catch-up is recorded (not revoked), the session is not cancelled, and the current original attendance status is still an eligible absence.
        ineligibleReason:
          oneOf:
            - type: string
              enum: [revoked, session_cancelled, original_status_changed]
            - type: "null"

    CatchupHistoryEntry:
      type: object
      required: [id, action, timestamp]
      properties:
        id: { type: integer }
        userId: { oneOf: [{ type: integer }, { type: "null" }] }
        userName: { oneOf: [{ type: string }, { type: "null" }] }
        action: { type: string, description: "catchup_recorded | catchup_re_recorded | catchup_corrected | catchup_revoked" }
        previousValue:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        newValue:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        timestamp: { type: string, format: date-time }

    CatchupFollowUpItem:
      type: object
      required:
        [
          learnerId,
          learnerName,
          sessionId,
          cohortId,
          cohortName,
          sessionDate,
          originalStatus,
          effective,
        ]
      properties:
        learnerId: { type: integer }
        learnerName: { type: string }
        sessionId: { type: integer }
        cohortId: { type: integer }
        cohortName: { type: string }
        sessionDate: { type: string, format: date }
        sessionTitle: { oneOf: [{ type: string }, { type: "null" }] }
        originalStatus: { $ref: "#/components/schemas/AttendanceStatus" }
        catchupId: { oneOf: [{ type: integer }, { type: "null" }] }
        catchupStatus: { oneOf: [{ type: string, enum: [recorded, revoked] }, { type: "null" }] }
        completionDate: { oneOf: [{ type: string, format: date }, { type: "null" }] }
        method: { oneOf: [{ $ref: "#/components/schemas/CatchupMethod" }, { type: "null" }] }
        note: { oneOf: [{ type: string }, { type: "null" }] }
        effective:
          type: boolean
          description: Whether the currently-recorded catch-up (if any) is effective -- false for outstanding, revoked, or none.

    CatchupFollowUpList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatchupFollowUpItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    RegisterCompletionSummary:
      type: object
      required:
        [
          periodStart,
          periodEnd,
          notStarted,
          inProgress,
          completed,
          locked,
          outstanding,
          completionPercentage,
        ]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        notStarted: { type: integer }
        inProgress: { type: integer }
        completed: { type: integer }
        locked: { type: integer }
        outstanding:
          description: Not-started/in-progress registers whose session date has already passed.
          type: integer
        completionPercentage:
          oneOf:
            - type: number
            - type: "null"

    AttendanceSummaryResponse:
      type: object
      required: [metrics, registerCompletion]
      properties:
        metrics: { $ref: "#/components/schemas/AttendanceMetrics" }
        registerCompletion: { $ref: "#/components/schemas/RegisterCompletionSummary" }

    LearnerAttendanceSummaryDetailResponse:
      allOf:
        - $ref: "#/components/schemas/AttendanceSummaryResponse"
        - type: object
          required: [cohortBreakdown]
          properties:
            cohortBreakdown:
              type: array
              items: { $ref: "#/components/schemas/LearnerCohortBreakdownEntry" }
              description: >-
                One entry per cohort this learner is currently expected in --
                home cohort plus each active Functional Skills secondary
                enrollment. metrics/registerCompletion above are the HOME
                cohort's figures specifically, never a blend.

    BudProgress:
      description: Supporting context from the separately-synced Bud LMS integration. Always shown apart from attendance figures, never combined into a single score.
      type: object
      properties:
        activityProgress:
          oneOf: [{ type: number }, { type: "null" }]
        activitiesOverdue:
          oneOf: [{ type: integer }, { type: "null" }]
        lastSubmissionDate:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
        lastCompletedActivity:
          oneOf: [{ type: string, format: date }, { type: "null" }]
        statusDesc:
          oneOf: [{ type: string }, { type: "null" }]
        learningPlanUrl:
          oneOf: [{ type: string }, { type: "null" }]
        syncedAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]

    LearnerAttendanceSummaryRow:
      type: object
      required: [learnerId, learnerName, learnerRef, metrics]
      properties:
        learnerId: { type: integer }
        learnerName: { type: string }
        learnerRef: { type: string }
        cohortName:
          oneOf:
            - type: string
            - type: "null"
        metrics: { $ref: "#/components/schemas/AttendanceMetrics" }
        bud:
          description: Null when no Bud sync match exists yet -- never breaks the row.
          oneOf:
            - $ref: "#/components/schemas/BudProgress"
            - type: "null"

    LearnerAttendanceSummaryListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LearnerAttendanceSummaryRow" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    OutstandingRegisterListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    TutorCohortOverviewRow:
      type: object
      required:
        [
          cohort,
          activeLearnerCount,
          nextSession,
          attendancePercentage,
          registerCompletion,
          lowAttendanceLearnerCount,
        ]
      properties:
        cohort: { $ref: "#/components/schemas/Cohort" }
        activeLearnerCount: { type: integer }
        nextSession:
          oneOf:
            - $ref: "#/components/schemas/SessionSummary"
            - type: "null"
        attendancePercentage:
          oneOf:
            - type: number
            - type: "null"
        registerCompletion: { $ref: "#/components/schemas/RegisterCompletionSummary" }
        lowAttendanceLearnerCount: { type: integer }

    AdminTutorOverviewRow:
      type: object
      required:
        [
          tutorId,
          tutorName,
          activeCohorts,
          activeLearners,
          attendancePercentage,
          registerCompletion,
          lowAttendanceLearnerCount,
        ]
      properties:
        tutorId: { type: integer }
        tutorName: { type: string }
        activeCohorts: { type: integer }
        activeLearners: { type: integer }
        attendancePercentage:
          oneOf:
            - type: number
            - type: "null"
        registerCompletion: { $ref: "#/components/schemas/RegisterCompletionSummary" }
        lowAttendanceLearnerCount: { type: integer }

    AdminTutorOverviewListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminTutorOverviewRow" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AdminCohortOverviewRow:
      type: object
      required:
        [
          cohort,
          activeLearnerCount,
          attendancePercentage,
          registerCompletion,
        ]
      properties:
        cohort: { $ref: "#/components/schemas/Cohort" }
        activeLearnerCount: { type: integer }
        attendancePercentage:
          oneOf:
            - type: number
            - type: "null"
        registerCompletion: { $ref: "#/components/schemas/RegisterCompletionSummary" }

    AdminCohortOverviewListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminCohortOverviewRow" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AuditLogEntry:
      type: object
      required:
        [
          id,
          userId,
          userName,
          action,
          entityType,
          entityId,
          previousValue,
          newValue,
          timestamp,
          ipAddress,
          correlationId,
        ]
      properties:
        id: { type: integer }
        userId: { type: ["integer", "null"] }
        userName: { type: ["string", "null"] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["integer", "null"] }
        previousValue: { type: ["string", "null"] }
        newValue: { type: ["string", "null"] }
        timestamp: { type: string, format: date-time }
        ipAddress: { type: ["string", "null"] }
        correlationId: { type: ["string", "null"] }

    AuditLogListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AppSettings:
      type: object
      required:
        [
          organisationName,
          lowAttendanceThreshold,
          budSyncMaxLearnerCreations,
          budSyncMaxLearnerUpdates,
          budSyncMaxCohortCreations,
          budSyncMaxTutorTransfers,
        ]
      properties:
        organisationName: { type: string }
        lowAttendanceThreshold: { type: number }
        budSyncMaxLearnerCreations: { type: integer }
        budSyncMaxLearnerUpdates: { type: integer }
        budSyncMaxCohortCreations: { type: integer }
        budSyncMaxTutorTransfers: { type: integer }

    SettingsUpdate:
      type: object
      properties:
        organisationName: { type: string, minLength: 1 }
        lowAttendanceThreshold: { type: number, minimum: 0, maximum: 100 }
        budSyncMaxLearnerCreations: { type: integer, minimum: 0, maximum: 1000 }
        budSyncMaxLearnerUpdates: { type: integer, minimum: 0, maximum: 1000 }
        budSyncMaxCohortCreations: { type: integer, minimum: 0, maximum: 1000 }
        budSyncMaxTutorTransfers: { type: integer, minimum: 0, maximum: 1000 }

    BudSyncBaselineStatus:
      type: string
      enum: [active, superseded]

    BudSyncJobStatus:
      type: string
      enum: [ready, committing, completed, failed]

    BudSyncMatchStatus:
      type: string
      enum: [new, existing_update, unchanged, conflict, existing_before_trial, skipped, status_change]

    BudSyncActionType:
      type: string
      enum:
        [
          create_learner,
          update_learner,
          create_cohort,
          create_allocation,
          transfer_tutor,
          change_start_date,
          change_status,
          none,
        ]

    BudSyncBaseline:
      type: object
      required:
        [
          id,
          establishedAt,
          establishedBy,
          sourceMaxSyncedAt,
          sourceRowCount,
          status,
          notes,
          correlationId,
        ]
      properties:
        id: { type: integer }
        establishedAt: { type: string, format: date-time }
        establishedBy: { type: integer }
        sourceMaxSyncedAt: { type: ["string", "null"], format: date-time }
        sourceRowCount: { type: integer }
        status: { $ref: "#/components/schemas/BudSyncBaselineStatus" }
        notes: { type: ["string", "null"] }
        correlationId: { type: ["string", "null"] }
        supersededAt: { type: ["string", "null"], format: date-time }
        supersededBy: { type: ["integer", "null"] }
        resetReason: { type: ["string", "null"] }

    BudSyncBaselineInput:
      type: object
      properties:
        notes: { type: ["string", "null"] }

    BudSyncBaselineResetInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    BudSyncStatus:
      type: object
      required: [sourceMaxSyncedAt, sourceRowCount, matchedLearnerCount, unmatchedLearnerCount, activeBaseline]
      properties:
        sourceMaxSyncedAt: { type: ["string", "null"], format: date-time }
        sourceRowCount: { type: integer }
        matchedLearnerCount: { type: integer }
        unmatchedLearnerCount: { type: integer }
        activeBaseline:
          oneOf:
            - $ref: "#/components/schemas/BudSyncBaseline"
            - type: "null"

    BudSyncJob:
      type: object
      required:
        [
          id,
          baselineId,
          status,
          startedAt,
          completedAt,
          startedBy,
          sourceMaxSyncedAt,
          totalSourceRowsExamined,
          newLearnersDetected,
          learnerUpdatesDetected,
          cohortsProposed,
          allocationsProposed,
          transfersProposed,
          approvedCount,
          appliedCount,
          skippedCount,
          conflictCount,
          errorCount,
          approvalReason,
          correlationId,
          errorSummary,
          statusChangesDetected,
        ]
      properties:
        id: { type: integer }
        baselineId: { type: integer }
        status: { $ref: "#/components/schemas/BudSyncJobStatus" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        startedBy: { type: integer }
        sourceMaxSyncedAt: { type: ["string", "null"], format: date-time }
        totalSourceRowsExamined: { type: integer }
        newLearnersDetected: { type: integer }
        learnerUpdatesDetected: { type: integer }
        cohortsProposed: { type: integer }
        allocationsProposed: { type: integer }
        transfersProposed: { type: integer }
        approvedCount: { type: integer }
        appliedCount: { type: integer }
        skippedCount: { type: integer }
        conflictCount: { type: integer }
        errorCount: { type: integer }
        approvalReason: { type: ["string", "null"] }
        correlationId: { type: ["string", "null"] }
        errorSummary: { type: ["string", "null"] }
        statusChangesDetected: { type: integer }

    BudSyncJobListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BudSyncJob" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    BudSyncJobSummary:
      type: object
      required:
        [
          statusChangesCount,
          newLearnersCount,
          conflictsCount,
          statusChangesAppliedToday,
          learnersCreatedToday,
          lastSuccessfulSyncAt,
        ]
      properties:
        statusChangesCount: { type: integer }
        newLearnersCount: { type: integer }
        conflictsCount: { type: integer }
        statusChangesAppliedToday: { type: integer }
        learnersCreatedToday: { type: integer }
        lastSuccessfulSyncAt: { type: ["string", "null"], format: date-time }

    BudSyncLinkExistingInput:
      type: object
      required: [learnerId]
      properties:
        learnerId: { type: integer }

    BudSyncBulkApproveItem:
      type: object
      required: [itemId, learnerRef, level]
      properties:
        itemId: { type: integer }
        learnerRef: { type: string, minLength: 1 }
        level: { type: string, minLength: 1 }

    BudSyncBulkApproveInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BudSyncBulkApproveItem" }

    BudSyncBulkApproveResult:
      type: object
      required: [approvedCount, errors]
      properties:
        approvedCount: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [itemId, message]
            properties:
              itemId: { type: integer }
              message: { type: string }

    BudSyncItem:
      type: object
      required:
        [
          id,
          syncJobId,
          sourceIdentifier,
          matchStatus,
          actionType,
          internalLearnerId,
          proposedValues,
          previousValues,
          warnings,
          reason,
          approved,
          applied,
          outcome,
          errorCode,
          processedAt,
          sourceLearnerReference,
          sourceFirstName,
          sourceLastName,
          createdAt,
        ]
      properties:
        id: { type: integer }
        syncJobId: { type: integer }
        sourceIdentifier: { type: string }
        matchStatus: { $ref: "#/components/schemas/BudSyncMatchStatus" }
        actionType: { $ref: "#/components/schemas/BudSyncActionType" }
        internalLearnerId: { type: ["integer", "null"] }
        proposedValues:
          type: object
          additionalProperties: true
        previousValues:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items: { type: string }
        reason: { type: ["string", "null"] }
        approved: { type: boolean }
        applied: { type: boolean }
        outcome: { type: ["string", "null"] }
        errorCode: { type: ["string", "null"] }
        processedAt: { type: ["string", "null"], format: date-time }
        sourceLearnerReference: { type: ["string", "null"] }
        sourceFirstName: { type: ["string", "null"] }
        sourceLastName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    BudSyncItemListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BudSyncItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    BudSyncItemUpdateInput:
      type: object
      properties:
        fieldUpdates:
          type: ["object", "null"]
          additionalProperties: { type: string }
        approved: { type: ["boolean", "null"] }

    BudSyncCommitInput:
      type: object
      required: [itemIds, approvalReason]
      properties:
        itemIds:
          type: array
          items: { type: integer }
          minItems: 1
        approvalReason: { type: string, minLength: 1 }
        limitOverrideReason: { type: ["string", "null"] }

    BudSyncUnmatchedPreBaselineItem:
      type: object
      required: [sourceIdentifier, internalLearnerId, reason, sourceLearnerReference, sourceFirstName, sourceLastName]
      properties:
        sourceIdentifier: { type: string }
        internalLearnerId: { type: ["integer", "null"] }
        reason: { type: ["string", "null"] }
        sourceLearnerReference: { type: ["string", "null"] }
        sourceFirstName: { type: ["string", "null"] }
        sourceLastName: { type: ["string", "null"] }

    BudSyncUnmatchedPreBaselineResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BudSyncUnmatchedPreBaselineItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
