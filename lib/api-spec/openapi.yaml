        "400":
          description: Not a pending scheduled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scheduled transfer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Attendance ----------
  /attendance/sessions:
    get:
      operationId: listAttendanceSessions
      tags: [attendance]
      parameters:
        - name: cohortId
          in: query
          schema: { type: integer }
        - name: tutorId
          in: query
          schema: { type: integer }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SessionStatus" }
        - name: registerStatus
          in: query
          schema: { $ref: "#/components/schemas/RegisterStatus" }
      responses:
        "200":
          description: Attendance sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttendanceSession" }
    post:
      operationId: createAttendanceSession
      tags: [attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "409":
          description: Duplicate session exists, confirm to override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}:
    get:
      operationId: getAttendanceSession
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attendance register for a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAttendanceSession
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceSessionUpdate"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is cancelled, or a schedule change needs confirmation because attendance is already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/cancel:
    post:
      operationId: cancelAttendanceSession
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCancelInput"
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "400":
          description: Already cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attendance already recorded, confirm to cancel anyway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/delete:
    post:
      operationId: deleteAttendanceSession
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionDeleteInput"
      responses:
        "204":
          description: Session soft-deleted -- retained for audit, hidden from every report and listing
        "400":
          description: Already deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attendance already recorded, confirm to delete anyway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/expected-learners:
    get:
      operationId: getSessionExpectedLearners
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The session's expected-learner register snapshot
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExpectedLearner" }
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/generate-register:
    post:
      operationId: generateSessionRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Register generated (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/refresh-register:
    post:
      operationId: refreshSessionRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRegisterInput"
      responses:
        "200":
          description: With confirm=false, a dry-run diff; with confirm=true, the applied result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RegisterRefreshDiff"
                  - $ref: "#/components/schemas/RegisterRefreshResult"
        "400":
          description: Session is cancelled, historical, or its register is already complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/register:
    put:
      operationId: saveAttendanceRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRegisterInput"
      responses:
        "200":
          description: Register saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is cancelled, register is locked, or the register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: One or more rows failed validation -- nothing was saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/complete-register:
    post:
      operationId: completeRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRegisterInput"
      responses:
        "200":
          description: Register completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "409":
          description: Session is cancelled, register is locked, or the register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: One or more expected learners are missing or invalid attendance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/lock:
    post:
      operationId: lockAttendanceRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockRegisterInput"
      responses:
        "200":
          description: Register locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "400":
          description: Register is not completed, or already locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/unlock:
    post:
      operationId: unlockAttendanceRegister
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRegisterInput"
      responses:
        "200":
          description: Register unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "400":
          description: Register is not locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/cover:
    put:
      operationId: assignCoverTutor
      tags: [attendance]
      description: >
        Upsert semantics: assigns a cover tutor when none is active, or
        changes the existing one. Administrator-only. Applies to this one
        session only -- the cohort's own tutor, learner allocations, and
        historical attendance authorship are never changed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverTutorInput"
      responses:
        "200":
          description: Cover tutor assigned or changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is cancelled, register is locked, or the register version is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Replacement tutor is invalid, inactive, the same as the original tutor, or "other" reason is missing notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/cover/remove:
    post:
      operationId: removeCoverTutor
      tags: [attendance]
      description: >
        Removes an active cover tutor. Administrator-only. Never deletes
        attendance already recorded while cover was active -- if any
        exists, requires confirmWithAttendance to proceed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveCoverTutorInput"
      responses:
        "200":
          description: Cover tutor removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSession"
        "400":
          description: This session does not have a cover tutor assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is cancelled, register is locked, the register version is stale, or attendance is already recorded (confirm to proceed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/sessions/{id}/mark-all-present:
    post:
      operationId: markAllPresent
      tags: [attendance]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: All learners marked present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "409":
          description: Session is cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Reports (Phase 9) ----------
  # All calculations here are backed by the same attendance_metrics engine
  # as /dashboard/* and /attendance-summary/* (Phase 8) -- report and
  # dashboard totals reconcile under identical filters by construction.
  /reports/learner/{learnerId}:
    get:
      operationId: getLearnerReportV2
      tags: [reports]
      parameters:
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Learner attendance report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerReportResponse" }
        "400":
          description: Invalid period/date range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not allowed to access this learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Learner not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /reports/learner/{learnerId}/export:
    get:
      operationId: exportLearnerReport
      tags: [reports]
      parameters:
        - name: learnerId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PeriodParam"
        - $ref: "#/components/parameters/DateFromParam"
        - $ref: "#/components/parameters/DateToParam"
      responses:
        "200":
          description: CSV export of this learner's session history
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: Export would exceed the maximum row limit
