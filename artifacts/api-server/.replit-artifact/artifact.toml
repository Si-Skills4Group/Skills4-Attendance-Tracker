kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "python -m uvicorn --app-dir artifacts/api-server pyapp.main:app --host 0.0.0.0 --port $PORT --reload"

[services.production]

[services.production.run]
args = ["python", "-m", "uvicorn", "--app-dir", "artifacts/api-server", "pyapp.main:app", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
